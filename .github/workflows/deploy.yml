name: deploy-to-coolify

# Coolify corre en un servidor casero que no esta publicado en internet, asi que
# GitHub no puede alcanzarlo con un webhook normal. En vez de exponer su panel de
# administracion, el runner entra a la tailnet y llama a la API por la direccion
# privada del servidor. La red es la frontera: la API de Coolify nunca escucha
# fuera de ella.
#
# Es el mismo mecanismo que despliega la API del observatorio; este repositorio
# guarda sus propias copias de los tres secretos porque un secreto de repositorio
# no cruza de un repositorio a otro.

on:
  # `dev` y no `main`: es la rama que el recurso de Coolify tiene configurada.
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# Un despliegue a la vez, y sin cancelar el que ya empezo: interrumpir a medias
# dejaria contenedores a medio recrear en el servidor.
concurrency:
  group: deploy-coolify-dashboard
  cancel-in-progress: false

env:
  # El contenedor publica aqui, sobre la interfaz de Tailscale. Es tambien la
  # unica via por la que este trabajo puede comprobar lo que desplego.
  DASHBOARD_URL: http://100.101.207.88:3003/

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.PABLO_H310_TAILSCALE_AUTHKEY }}
          # El nodo se borra solo al terminar el trabajo, en lugar de dejar una
          # maquina muerta en la tailnet por cada ejecucion.
          args: --ssh=false

      - name: Wait for the server to answer
        run: |
          for attempt in $(seq 1 10); do
            if tailscale ping --c 1 --timeout 5s 100.101.207.88 >/dev/null 2>&1; then
              echo "servidor alcanzable"
              exit 0
            fi
            echo "intento $attempt: aun sin ruta, reintentando"
            sleep 3
          done
          echo "no hay ruta al servidor por la tailnet" >&2
          exit 1

      - name: Note which build is serving now
        id: before
        run: |
          # Next nombra su hoja de estilos por el contenido, asi que la ruta
          # cambia con cada compilacion. Guardarla antes de desplegar es lo que
          # permite despues distinguir «el tablero nuevo ya responde» de «el viejo
          # sigue en pie». La alternativa —el estado del despliegue en la API de
          # Coolify— exige un token con permiso de lectura, y el que hay aqui solo
          # puede disparar webhooks.
          id=$(curl --silent --max-time 60 "$DASHBOARD_URL" \
               | grep -oE '/_next/static/css/[a-z0-9]+[.]css' | head -n 1 || true)
          echo "hoja en servicio: ${id:-ninguna, el tablero no responde}"
          echo "build=$id" >> "$GITHUB_OUTPUT"

      - name: Trigger the deployment
        env:
          WEBHOOK: ${{ secrets.PABLO_H310_COOLIFY_WEBHOOK }}
          TOKEN: ${{ secrets.PABLO_H310_COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ] || [ -z "$TOKEN" ]; then
            echo "faltan PABLO_H310_COOLIFY_WEBHOOK o PABLO_H310_COOLIFY_TOKEN" >&2
            exit 1
          fi
          # POST, no GET: Coolify movio este endpoint y responde 405 a un GET.
          # --fail-with-body para que un rechazo suyo se vea en el log en vez de
          # morir con un codigo de salida mudo.
          curl --fail-with-body --silent --show-error --max-time 60 \
               --request POST \
               --header "Authorization: Bearer $TOKEN" \
               --header "Accept: application/json" \
               --header "Content-Length: 0" \
               "$WEBHOOK"
          echo
          echo "despliegue solicitado a Coolify"

      - name: Wait for the new build to serve, and to read the database
        env:
          BEFORE: ${{ steps.before.outputs.build }}
        run: |
          # Un contenedor que arranca no es un tablero que funciona: el recurso
          # ha estado «running» y verde sirviendo la pagina de error de lectura.
          # Asi que no se da por bueno un despliegue hasta que la compilacion
          # nueva responde Y trae cifras.
          #
          # Veinte minutos de margen: Coolify construye la imagen de Next en el
          # servidor, y la primera peticion despues arma la tabulacion completa
          # del corpus, que es lenta una vez por diseno.
          deadline=$(( $(date +%s) + 1200 ))
          served=""

          while [ "$(date +%s)" -lt "$deadline" ]; do
            body=$(curl --silent --max-time 150 "$DASHBOARD_URL" || true)
            id=$(printf '%s' "$body" | grep -oE '/_next/static/css/[a-z0-9]+\.css' | head -n 1 || true)

            if [ -n "$id" ] && [ "$id" != "$BEFORE" ]; then
              served="$body"
              echo "la compilacion nueva ya responde"
              break
            fi

            if [ -z "$id" ]; then
              echo "el tablero no responde todavia"
            else
              echo "sigue en servicio la compilacion anterior"
            fi
            sleep 15
          done

          if [ -z "$served" ]; then
            echo "la compilacion nueva no llego a servir en veinte minutos." >&2
            echo "Revisa el log del despliegue en Coolify." >&2
            exit 1
          fi

          if printf '%s' "$served" | grep -q 'No fue posible leer la base de datos'; then
            echo "el tablero responde pero no pudo leer la base." >&2
            echo "Revisa DASHBOARD_DATABASE_URL en el recurso de Coolify y que" >&2
            echo "'Connect To Predefined Network' este activado." >&2
            exit 1
          fi

          echo "el tablero desplegado responde y leyo la base"
