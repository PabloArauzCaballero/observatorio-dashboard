name: deploy-to-coolify

# Coolify corre en un servidor casero que no esta publicado en internet, asi que
# GitHub no puede alcanzarlo con un webhook normal. En vez de exponer su panel de
# administracion, el runner entra a la tailnet y llama a la API por la direccion
# privada del servidor. La red es la frontera: la API de Coolify nunca escucha
# fuera de ella.
#
# Es el mismo mecanismo que despliega la API del observatorio; este repositorio
# guarda sus propias copias de los tres secretos porque un secreto de repositorio
# no cruza de un repositorio a otro.

on:
  # `dev` y no `main`: es la rama que el recurso de Coolify tiene configurada.
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# Un despliegue a la vez, y sin cancelar el que ya empezo: interrumpir a medias
# dejaria contenedores a medio recrear en el servidor.
concurrency:
  group: deploy-coolify-dashboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.PABLO_H310_TAILSCALE_AUTHKEY }}
          # El nodo se borra solo al terminar el trabajo, en lugar de dejar una
          # maquina muerta en la tailnet por cada ejecucion.
          args: --ssh=false

      - name: Wait for the server to answer
        run: |
          for attempt in $(seq 1 10); do
            if tailscale ping --c 1 --timeout 5s 100.101.207.88 >/dev/null 2>&1; then
              echo "servidor alcanzable"
              exit 0
            fi
            echo "intento $attempt: aun sin ruta, reintentando"
            sleep 3
          done
          echo "no hay ruta al servidor por la tailnet" >&2
          exit 1

      - name: Trigger the deployment
        id: trigger
        env:
          WEBHOOK: ${{ secrets.PABLO_H310_COOLIFY_WEBHOOK }}
          TOKEN: ${{ secrets.PABLO_H310_COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ] || [ -z "$TOKEN" ]; then
            echo "faltan PABLO_H310_COOLIFY_WEBHOOK o PABLO_H310_COOLIFY_TOKEN" >&2
            exit 1
          fi
          # POST, no GET: Coolify movio este endpoint y responde 405 a un GET.
          # --fail-with-body para que un rechazo suyo se vea en el log en vez de
          # morir con un codigo de salida mudo.
          body=$(curl --fail-with-body --silent --show-error --max-time 60                       --request POST                       --header "Authorization: Bearer $TOKEN"                       --header "Accept: application/json"                       --header "Content-Length: 0"                       "$WEBHOOK")
          echo "$body"
          echo "despliegue solicitado a Coolify"

          # Coolify devuelve el identificador del despliegue que acaba de encolar.
          # Se extrae para poder esperarlo; si la forma de la respuesta cambia, el
          # paso siguiente lo informa y no falla el trabajo por eso.
          uuid=$(printf '%s' "$body" | jq -r '.deployments[0].deployment_uuid // empty' 2>/dev/null || true)
          echo "deployment_uuid=$uuid" >> "$GITHUB_OUTPUT"

      - name: Wait for the build to finish
        env:
          UUID: ${{ steps.trigger.outputs.deployment_uuid }}
          TOKEN: ${{ secrets.PABLO_H310_COOLIFY_TOKEN }}
        run: |
          # Sin esta espera el trabajo queda en verde por haber pedido el
          # despliegue, aunque Coolify falle al construir la imagen un minuto
          # despues: el tablero seguiria sirviendo la version anterior y nadie
          # se enteraria hasta abrirlo.
          if [ -z "$UUID" ]; then
            echo "Coolify no devolvio un deployment_uuid; no hay nada que esperar." >&2
            echo "Revisa el estado del recurso en el panel." >&2
            exit 0
          fi

          for attempt in $(seq 1 80); do
            status=$(curl --silent --show-error --max-time 30                           --header "Authorization: Bearer $TOKEN"                           --header "Accept: application/json"                           "http://100.101.207.88/api/v1/deployments/$UUID"                      | jq -r '.status // empty')
            case "$status" in
              finished) echo "despliegue terminado"; exit 0 ;;
              failed|cancelled-by-user)
                echo "el despliegue termino en '$status'; revisa el log en Coolify" >&2
                exit 1 ;;
              "") echo "intento $attempt: Coolify aun no reporta estado" ;;
              *) echo "intento $attempt: $status" ;;
            esac
            sleep 10
          done

          echo "el despliegue seguia en curso tras trece minutos; no se da por bueno" >&2
          exit 1

      - name: Check that the deployed page reads the database
        run: |
          # Un contenedor que arranca no es un tablero que funciona. Hoy mismo el
          # recurso esta "running" y sirve la pagina de error de lectura: sin esta
          # comprobacion el despliegue quedaria verde igual. Se mira la portada
          # por la interfaz de la tailnet, que es donde el contenedor publica.
          url="http://100.101.207.88:${WEB_PUBLISH_PORT:-3003}/"

          for attempt in $(seq 1 20); do
            # La primera peticion tras un arranque arma la tabulacion completa del
            # corpus, asi que el margen es amplio a proposito.
            body=$(curl --silent --show-error --max-time 120 "$url" || true)
            if [ -n "$body" ]; then
              break
            fi
            echo "intento $attempt: el tablero aun no responde"
            sleep 10
          done

          if [ -z "$body" ]; then
            echo "el tablero no respondio en $url" >&2
            exit 1
          fi

          if printf '%s' "$body" | grep -q 'No fue posible leer la base de datos'; then
            echo "el tablero responde pero no pudo leer la base." >&2
            echo "Revisa DASHBOARD_DATABASE_URL en el recurso de Coolify y que" >&2
            echo "'Connect To Predefined Network' este activado." >&2
            exit 1
          fi

          echo "el tablero responde y leyo la base"
