<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="grad_evo-morales" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <radialGradient id="ring_evo-morales" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.2" />
    </radialGradient>
    <filter id="shadow_evo-morales" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base with Squircle -->
  <rect width="160" height="160" rx="36" fill="url(#grad_evo-morales)" />
  
  <!-- Subtle Inner Border Accent -->
  <rect x="2" y="2" width="156" height="156" rx="34" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-opacity="0.35" />

  <!-- Ambient Light Circle -->
  <circle cx="80" cy="80" r="58" fill="url(#ring_evo-morales)" opacity="0.12" />

  <!-- Stylized Person Portrait Contour -->
  <g filter="url(#shadow_evo-morales)">
    <!-- Head / Silhouette -->
    <circle cx="80" cy="62" r="26" fill="#ffffff" fill-opacity="0.95" />
    
    <!-- Torso / Shoulders Base -->
    <path d="M 36 138 C 36 104, 60 98, 80 98 C 100 98, 124 104, 124 138 Z" fill="#ffffff" fill-opacity="0.92" />
  </g>

  <!-- Initials Crest Badge on Chest -->
  <circle cx="80" cy="86" r="20" fill="#4c0519" stroke="#f43f5e" stroke-width="2" />
  <text x="80" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">EM</text>

  <!-- Sector Accent Pill on Bottom -->
  <rect x="24" y="142" width="112" height="14" rx="7" fill="#4c0519" opacity="0.9" />
  <text x="80" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle" fill="#f43f5e" letter-spacing="0.8">POLITICS</text>
</svg>